[project]
name = "plaud"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-whisper>=0.4.3",
    "pyannote.audio>=4.0,<5",
    "soundfile>=0.12",
    "torch>=2.4",
]

[project.scripts]
plaud = "plaud.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plaud"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: loads real models, needs network on first run and HF_TOKEN"]
addopts = "-m 'not slow'"
