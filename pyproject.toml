[project]
name = "plaud"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Apple Silicon: Whisper on the Mac GPU. Linux: faster-whisper (CUDA or CPU).
    "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.1",
    "pyannote.audio>=4.0,<5",
    "soundfile>=0.12",
    "torch>=2.4",
]

[project.scripts]
plaud = "plaud.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plaud"]

[tool.uv]
# Supported platforms. Intel Macs are out: torch no longer ships wheels for them.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux'",
]

# On Linux, take torch's CUDA 12 build: faster-whisper (CTranslate2) needs cuBLAS 12 and
# cuDNN 9, and PyPI's default Linux torch now brings CUDA 13 libraries instead.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: loads real models, needs network on first run and HF_TOKEN"]
addopts = "-m 'not slow'"
